[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ghidra-mcp"
dynamic = ["version"]
description = "Single-process MCP server for headless Ghidra automation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=1.30,<2",
  "pyghidra>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/xjoker/ghidra-mcp"
Issues = "https://github.com/xjoker/ghidra-mcp/issues"
Container = "https://github.com/xjoker/ghidra-mcp/pkgs/container/ghidra-mcp"

[project.scripts]
ghidra-mcp = "ghidra_mcp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pyyaml>=6.0.3,<7",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ghidra_mcp"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: requires a real Ghidra installation and generated ELF fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
