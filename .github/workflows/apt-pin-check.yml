name: Apt pin check

# Read-only early warning: fails when a pinned runtime apt package in the
# Dockerfile can no longer be installed in the pinned base image (Ubuntu has
# published a newer version). A red scheduled run is the signal; it does not
# open issues or write anything.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-pin-check
  cancel-in-progress: true

jobs:
  check:
    name: Runtime apt pins are installable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Simulate installing the pinned runtime packages
        run: python3 scripts/check_apt_pins.py
