name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install uv
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/pip" install --require-hashes -r tools/uv-requirements.txt
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Unit and contract tests
        run: uv run --locked pytest -m 'not integration'

      - name: Lint
        run: uv run --locked ruff check .
